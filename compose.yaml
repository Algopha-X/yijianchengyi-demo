name: ycy-sprint2-demo
services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:${DEMO_PORT:-8000}:8000"
    environment:
      APP_ENV: development
      LLM_MODE: mock
      IMAGE_MODE: mock
      VERIFICATION_MODE: development
      APP_ALLOWED_ORIGINS: "http://127.0.0.1:${DEMO_PORT:-8000}"
      COOKIE_SECURE: "false"
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/app.db
      JOB_CONCURRENCY: "2"
      JOB_QUEUE_LIMIT: "20"
    volumes:
      - demo-data:/app/data
    shm_size: 512mb
volumes:
  demo-data:
